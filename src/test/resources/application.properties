# CONFIGURAÇÕES DO BANCO DE DADOS (TESTES COM H2)
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=false

# LOGS
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.orm.connections.pooling=ERROR

# JWT
api.security.token.secret=${JWT_SECRET:test-secret-key-123456789012345678901234567890}

# SERVER
server.port=${PORT:8080}